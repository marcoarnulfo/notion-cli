name: Release

# Tags only, and only release-shaped ones. A push to main must never publish
# anything: releasing is a decision someone makes by pushing a tag, not a side
# effect of merging.
#
# The pattern is narrower than 'v*' on purpose. A moving major tag like `v1`
# — the kind a composite action is consumed through — would otherwise fire a
# full release run every time it is repointed, publishing archives named
# notion-track_1_linux_amd64 and a spurious GitHub Release beside them.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  # Writing the release and uploading its assets. Nothing else — the default
  # token is read-only, and GoReleaser needs exactly this one escalation.
  contents: write

# Two tags pushed moments apart would otherwise run two GoReleaser jobs
# against the same repo. Never cancel one mid-flight: a half-uploaded release
# is worse than a queued one.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      # Every third-party action here is pinned to a full commit SHA, not a
      # tag. This job holds a token that can publish executables under this
      # project's name, and a tag is mutable: whoever controls the upstream
      # repo — or whoever compromises that account — can repoint v7 at any
      # commit and have it run here with write access. The comment carries the
      # human-readable version so Dependabot can bump both together.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # GoReleaser builds the changelog from the commits since the previous
          # tag, which it cannot see in a shallow clone.
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # From go.mod rather than a literal, so the release cannot be built
          # with a toolchain the module does not ask for.
          go-version-file: go.mod

      # The CI gates that do not require pulling an unpinned tool, re-run here
      # on the exact commit being released: a tag can be pushed to any commit,
      # including one that never went through a PR.
      #
      # staticcheck is deliberately absent. CI runs it as
      # `go run honnef.co/go/tools/cmd/staticcheck@latest`, and fetching an
      # unpinned tool inside the job that publishes binaries would give back
      # exactly the supply-chain property the SHA pins above exist to protect.
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test ./... -race

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          # An exact version, not '~> v2': the action downloads this binary at
          # run time, and a floating range is one more unpinned dependency in
          # a privileged job.
          version: '2.17.1'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Install what was just published, with the composite action, on every runner
  # OS — the only check that the archive names GoReleaser writes are the ones
  # the action reconstructs, against the real release rather than a snapshot.
  #
  # It lives here, in the release workflow, rather than in action-smoke.yml
  # behind a `release: [published]` trigger. That trigger cannot work: GoReleaser
  # publishes with the default GITHUB_TOKEN, and GitHub does not start workflow
  # runs from events raised by that token. A job that `needs` the one above runs
  # in the same workflow, so it cannot silently fail to fire.
  #
  # This verifies, it does not gate: by the time it runs the release is already
  # public. A failure here means the archives are up but unusable — which is
  # exactly when someone needs to be told, loudly, rather than finding out from
  # a colleague.
  smoke:
    needs: goreleaser
    permissions:
      # Downloading the release this workflow just published. The write
      # permission above belongs to GoReleaser alone.
      contents: read
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-latest      # linux/amd64
          - ubuntu-24.04-arm   # linux/arm64  (uname -m: aarch64)
          - macos-latest       # darwin/arm64
          - windows-latest     # windows/amd64, via Git Bash and 7z
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The tag being released, never "latest": a prerelease is not what
      # "latest" resolves to, and even for a normal release, asking for
      # "latest" here would verify whatever is newest rather than what this
      # run just built.
      - id: install
        uses: ./action
        with:
          version: ${{ github.ref_name }}

      - name: The release that was just published installs and runs
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          got="$(notion-track --version)"
          [ "$got" = "$TAG" ] || {
            echo "::error::published $TAG but the installed binary reports $got"
            exit 1
          }
          echo "notion-track $got installs from the release just published"
