name: Release

# Tags only. A push to main must never publish anything: releasing is a
# decision someone makes by pushing a tag, not a side effect of merging.
on:
  push:
    tags:
      - 'v*'

permissions:
  # Writing the release and uploading its assets. Nothing else — the default
  # token is read-only, and GoReleaser needs exactly this one escalation.
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # GoReleaser builds the changelog from the commits since the previous
          # tag, which it cannot see in a shallow clone.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      # The same gates CI runs on every push, run once more here on the exact
      # commit being released: a tag can be pushed to any commit, including one
      # that never went through a PR.
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test ./... -race

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
