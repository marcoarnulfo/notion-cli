# GoReleaser builds the binaries a CI runner downloads instead of compiling.
#
# The point of publishing these at all: a workflow that flips a task's status
# should not need a Go toolchain and a compile to do it. See issue #1.
version: 2

before:
  hooks:
    # download, not tidy: tidy rewrites go.mod/go.sum during the release
    # build, so the published binary could be built from a dependency set
    # that differs from the one committed at the tag.
    - go mod download

builds:
  - id: notion-track
    main: ./cmd/notion-track
    binary: notion-track
    # No cgo: the binary has to run on whatever a CI runner or a container
    # happens to be, including images with no libc to link against.
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      # -s -w strip the symbol table and DWARF: nobody debugs a released
      # binary with gdb, and it is a third off the download.
      #
      # The -X is the whole reason the version lives in a package-level var:
      # this is what makes `notion-track --version` and the MCP handshake
      # report the tag instead of "dev".
      #
      # .Tag, not .Version: they differ by the leading "v" (v0.6.0 vs 0.6.0),
      # and a script comparing `notion-track --version` against a git tag
      # should not have to know which of the two it is holding.
      - -s -w -X github.com/marcoarnulfo/notion-cli/internal/cli.Version={{ .Tag }}

archives:
  - id: notion-track
    ids:
      - notion-track
    # A name a human can read off a releases page and a script can predict:
    # the composite action in action/action.yml builds exactly this string.
    #
    # "notion-track", not {{ .ProjectName }}: the project is notion-cli but the
    # binary inside is notion-track, and an archive should say what it holds.
    name_template: >-
      notion-track_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE

checksum:
  # One file listing every archive's SHA-256. The composite action verifies
  # its download against this rather than trusting the transport, which is the
  # difference between "downloaded something" and "downloaded what was built".
  name_template: checksums.txt
  algorithm: sha256

changelog:
  use: github
  sort: asc
  filters:
    # Docs and chores are real work, but a release note listing them buries
    # the two lines a reader actually came for.
    exclude:
      - "^docs:"
      - "^docs\\("
      - "^test:"
      - "^test\\("
      - "^chore:"
      - "^ci:"

release:
  draft: false
  prerelease: auto
  footer: |
    ---

    Verify a download against `checksums.txt` before running it. Checking the
    whole file at once with `--ignore-missing` can exit 0 having verified
    nothing, if your archive's name doesn't match any line in it — pull out
    that one line first, so a missing line fails loudly instead:

    ```bash
    archive=notion-track_{{ .Version }}_linux_amd64.tar.gz   # swap in the file you downloaded
    grep -E "  ${archive}\$" checksums.txt > expected.txt
    sha256sum --check expected.txt   # no sha256sum? use: shasum -a 256 --check expected.txt
    ```
